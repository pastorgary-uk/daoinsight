<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>daoinsight — Pastor Gary 的聖經慢讀空間</title>
<link rel="icon" type="image/png" href="assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&family=Noto+Serif+TC:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
/* ===========================
   daoinsight — Design System
   現代簡約、攝影感、留白
   =========================== */

:root {
  /* Brand */
  --ink: #0E1116;            /* near-black for body text */
  --ink-soft: #2A2F38;
  --ink-mute: #5B6472;
  --ink-faint: #9AA1AC;
  --line: #E8E5DF;            /* warm hairline */
  --line-soft: #F1EEE8;
  --paper: #FAF7F1;           /* warm off-white background */
  --paper-2: #F4EFE6;
  --white: #FFFFFF;
  --accent: #1E3A2B;          /* deep evergreen — quiet, sacred */
  --accent-2: #C9A961;        /* aged brass — for verse marks */
  --accent-soft: #E8EDE8;

  /* Type */
  --serif: "Cormorant Garamond", "Source Han Serif TC", "Noto Serif TC", "Songti TC", serif;
  --serif-display: "Cormorant Garamond", "Source Han Serif TC", "Noto Serif TC", serif;
  --sans: "Inter", "Noto Sans TC", -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  --mono: "JetBrains Mono", "SFMono-Regular", ui-monospace, monospace;

  /* Scale */
  --radius: 2px;
  --radius-lg: 4px;
  --shadow-sm: 0 1px 2px rgba(14,17,22,0.04);
  --shadow: 0 8px 32px rgba(14,17,22,0.08);

  /* Spacing rhythm (8pt) */
  --s1: 8px;
  --s2: 16px;
  --s3: 24px;
  --s4: 32px;
  --s5: 48px;
  --s6: 64px;
  --s7: 96px;
  --s8: 128px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

img { display: block; max-width: 100%; }

a {
  color: inherit;
  text-decoration: none;
  transition: opacity 0.2s ease, color 0.2s ease;
}

button {
  font-family: inherit;
  font-size: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}

/* ===========================
   Type system
   =========================== */
.serif { font-family: var(--serif); }
.sans  { font-family: var(--sans); }
.mono  { font-family: var(--mono); }

.eyebrow {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-mute);
  font-weight: 500;
}

.display-xl {
  font-family: var(--serif-display);
  font-weight: 400;
  font-size: clamp(48px, 7vw, 96px);
  line-height: 1.02;
  letter-spacing: -0.02em;
}

.display-l {
  font-family: var(--serif-display);
  font-weight: 400;
  font-size: clamp(40px, 5vw, 64px);
  line-height: 1.08;
  letter-spacing: -0.015em;
}

.display-m {
  font-family: var(--serif-display);
  font-weight: 400;
  font-size: clamp(28px, 3vw, 40px);
  line-height: 1.15;
  letter-spacing: -0.01em;
}

.body-l {
  font-size: 18px;
  line-height: 1.65;
  color: var(--ink-soft);
}

.body { font-size: 15px; line-height: 1.65; color: var(--ink-soft); }

.caption {
  font-size: 13px;
  line-height: 1.5;
  color: var(--ink-mute);
}

.tnum { font-variant-numeric: tabular-nums; }

/* Chinese serif tuning */
:lang(zh), .zh {
  font-family: var(--serif);
  font-feature-settings: "palt";
}

/* ===========================
   Layout primitives
   =========================== */
.container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 var(--s4);
}

.container-narrow {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 var(--s4);
}

.hairline { height: 1px; background: var(--line); border: 0; }
.hairline-vertical { width: 1px; background: var(--line); }

/* ===========================
   Nav
   =========================== */
.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(250, 247, 241, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}

.nav-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 var(--s4);
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  display: flex;
  align-items: baseline;
  gap: 2px;
  font-family: var(--serif-display);
  font-size: 22px;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.logo-mark {
  display: inline-block;
  width: 10px;
  height: 10px;
  border: 1.5px solid var(--accent);
  border-radius: 50%;
  margin-right: 10px;
  position: relative;
  top: 1px;
}
.logo-mark::after {
  content: "";
  position: absolute;
  inset: 2px;
  background: var(--accent-2);
  border-radius: 50%;
}
.logo em { font-style: italic; color: var(--accent); }

.nav-links {
  display: flex;
  gap: var(--s4);
  list-style: none;
}
.nav-links a {
  font-size: 14px;
  color: var(--ink-soft);
  position: relative;
  padding: 4px 0;
}
.nav-links a:hover { color: var(--ink); }
.nav-links a.active { color: var(--ink); }
.nav-links a.active::after {
  content: "";
  position: absolute;
  left: 0; right: 0;
  bottom: -22px;
  height: 1px;
  background: var(--ink);
}

.nav-right {
  display: flex;
  align-items: center;
  gap: var(--s2);
}

.lang-toggle {
  display: flex;
  font-size: 12px;
  letter-spacing: 0.08em;
  color: var(--ink-mute);
  gap: 8px;
  align-items: center;
}
.lang-toggle button { padding: 4px 6px; }
.lang-toggle button.active { color: var(--ink); font-weight: 600; }
.lang-toggle .sep { color: var(--ink-faint); }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 18px;
  font-size: 13px;
  letter-spacing: 0.04em;
  border: 1px solid var(--ink);
  color: var(--ink);
  background: transparent;
  border-radius: 999px;
  transition: background 0.2s ease, color 0.2s ease;
}
.btn:hover { background: var(--ink); color: var(--paper); }

.btn-solid {
  background: var(--ink);
  color: var(--paper);
}
.btn-solid:hover { background: var(--accent); border-color: var(--accent); }

.btn-ghost {
  border-color: var(--line);
  color: var(--ink-soft);
}
.btn-ghost:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* ===========================
   Footer
   =========================== */
.footer {
  border-top: 1px solid var(--line);
  padding: var(--s6) 0 var(--s4);
  margin-top: var(--s7);
}
.footer-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 var(--s4);
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr;
  gap: var(--s5);
}
.footer h5 {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: var(--s2);
  font-weight: 500;
}
.footer ul { list-style: none; }
.footer li { margin-bottom: 10px; }
.footer a { font-size: 14px; color: var(--ink-soft); }
.footer a:hover { color: var(--ink); }
.footer-tagline {
  font-family: var(--serif);
  font-size: 22px;
  line-height: 1.3;
  color: var(--ink);
  max-width: 320px;
}
.footer-bottom {
  max-width: 1280px;
  margin: var(--s5) auto 0;
  padding: var(--s3) var(--s4) 0;
  border-top: 1px solid var(--line-soft);
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--ink-mute);
}

/* ===========================
   Utility
   =========================== */
.row { display: flex; }
.col { display: flex; flex-direction: column; }
.gap-s2 { gap: var(--s2); }
.gap-s3 { gap: var(--s3); }
.gap-s4 { gap: var(--s4); }
.center { align-items: center; }
.between { justify-content: space-between; }

.fade-in { animation: fadeIn 0.6s ease both; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* page-specific transitions */
.page { animation: fadeIn 0.4s ease both; }

/* ============================================================
   daoinsight — Page-specific styles
   ============================================================ */

/* ===== HOME ===== */
.hero {
  position: relative;
  padding: var(--s7) 0 var(--s7);
  overflow: hidden;
}
.hero-grid {
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  gap: var(--s6);
  align-items: center;
}
.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  margin-bottom: var(--s3);
}
.hero-eyebrow::before {
  content: "";
  width: 32px;
  height: 1px;
  background: var(--accent-2);
}
.hero h1 {
  font-family: var(--serif-display);
  font-size: clamp(56px, 7vw, 104px);
  line-height: 0.98;
  letter-spacing: -0.025em;
  font-weight: 400;
  color: var(--ink);
}
.hero h1 em {
  font-style: italic;
  color: var(--accent);
}
.hero-sub {
  font-size: 19px;
  line-height: 1.6;
  color: var(--ink-mute);
  margin-top: var(--s3);
  max-width: 480px;
}
.hero-cta { display: flex; gap: 12px; margin-top: var(--s4); }
.hero-photo { aspect-ratio: 4/5; }

.hero-stamp {
  position: absolute;
  right: 32px;
  top: 32px;
  width: 96px;
  height: 96px;
  border: 1px solid var(--line);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif);
  font-style: italic;
  font-size: 13px;
  color: var(--ink-mute);
  text-align: center;
  line-height: 1.3;
  background: rgba(255,255,255,0.5);
}

/* daily verse card on home */
.verse-feature {
  padding: var(--s6) 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.verse-feature-grid {
  display: grid;
  grid-template-columns: 1fr 1.4fr;
  gap: var(--s6);
  align-items: center;
}
.verse-feature .verse-img { aspect-ratio: 1/1.1; }
.verse-feature .quote-mark {
  font-family: var(--serif-display);
  font-size: 80px;
  line-height: 0.5;
  color: var(--accent-2);
  margin-bottom: var(--s2);
}
.verse-feature blockquote {
  font-family: var(--serif);
  font-size: clamp(28px, 3vw, 40px);
  line-height: 1.3;
  color: var(--ink);
  margin-bottom: var(--s3);
}
.verse-feature cite {
  font-style: normal;
  letter-spacing: 0.06em;
  font-size: 13px;
  color: var(--ink-mute);
  text-transform: uppercase;
}

/* sections */
.section { padding: var(--s7) 0; }
.section-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  margin-bottom: var(--s5);
  gap: var(--s3);
}
.section-head h2 { max-width: 720px; }

/* article card */
.article-card {
  display: flex;
  flex-direction: column;
  gap: 16px;
  text-decoration: none;
  color: inherit;
  cursor: pointer;
  transition: transform 0.4s ease;
}
.article-card:hover { transform: translateY(-4px); }
.article-card:hover .article-title { color: var(--accent); }
.article-card .photo { margin-bottom: 4px; transition: transform 0.6s ease; }
.article-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  letter-spacing: 0.06em;
  color: var(--ink-mute);
  text-transform: uppercase;
}
.article-meta .dot { color: var(--ink-faint); }
.article-title {
  font-family: var(--serif);
  font-size: 26px;
  line-height: 1.2;
  letter-spacing: -0.01em;
  color: var(--ink);
  transition: color 0.2s ease;
}
.article-card.l .article-title { font-size: 38px; }
.article-card.s .article-title { font-size: 20px; }
.article-excerpt {
  font-size: 15px;
  color: var(--ink-soft);
  line-height: 1.6;
}
.article-footer {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--ink-mute);
  letter-spacing: 0.04em;
  margin-top: 4px;
}

/* article grid layouts */
.article-grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--s5);
}
.article-grid-feature {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: var(--s5);
  align-items: start;
}
.article-grid-feature .secondary {
  display: flex;
  flex-direction: column;
  gap: var(--s4);
}
.article-grid-feature .secondary .article-card {
  flex-direction: row;
  align-items: start;
  gap: 24px;
}
.article-grid-feature .secondary .article-card .photo {
  width: 180px;
  flex-shrink: 0;
  aspect-ratio: 4/5;
}

/* Reading plans */
.plan-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--s4);
}
.plan-card {
  position: relative;
  padding: var(--s4);
  border: 1px solid var(--line);
  background: var(--white);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  min-height: 280px;
  transition: border-color 0.2s ease, transform 0.4s ease;
  cursor: pointer;
}
.plan-card:hover { border-color: var(--ink); transform: translateY(-2px); }
.plan-card .plan-num {
  font-family: var(--serif-display);
  font-size: 56px;
  font-style: italic;
  color: var(--accent-2);
  line-height: 1;
  margin-bottom: 4px;
}
.plan-card h3 {
  font-family: var(--serif);
  font-size: 24px;
  font-weight: 400;
  margin-top: 16px;
  margin-bottom: 12px;
  letter-spacing: -0.01em;
}
.plan-card p { color: var(--ink-mute); font-size: 14px; line-height: 1.55; flex-grow: 1; }
.plan-card .plan-cta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: var(--s3);
  padding-top: var(--s3);
  border-top: 1px solid var(--line-soft);
  font-size: 12px;
  letter-spacing: 0.08em;
  color: var(--ink-mute);
  text-transform: uppercase;
}
.plan-card .plan-cta .arrow { transition: transform 0.3s ease; }
.plan-card:hover .plan-cta .arrow { transform: translateX(6px); }

/* Topics chips */
.topic-cloud {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
}
.topic-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 20px;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-family: var(--serif);
  font-size: 18px;
  color: var(--ink-soft);
  transition: all 0.2s ease;
  cursor: pointer;
}
.topic-chip:hover {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.topic-chip .num {
  font-family: var(--sans);
  font-size: 11px;
  color: var(--ink-faint);
  font-feature-settings: "tnum";
}
.topic-chip:hover .num { color: var(--paper); opacity: 0.7; }

/* IG Feed */
.ig-section { padding: var(--s7) 0; border-top: 1px solid var(--line); }
.ig-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  margin-top: var(--s5);
}
.ig-tile {
  position: relative;
  aspect-ratio: 1/1;
  overflow: hidden;
  cursor: pointer;
  background: var(--paper-2);
}
.ig-tile .ig-art {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 24px;
  text-align: center;
}
.ig-tile .ig-art .verse {
  font-family: var(--serif);
  color: var(--white);
  font-size: 20px;
  line-height: 1.4;
  text-shadow: 0 2px 16px rgba(0,0,0,0.4);
  font-style: italic;
}
.ig-tile .ig-art .ref {
  font-family: var(--sans);
  color: var(--white);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-top: 12px;
  opacity: 0.9;
}
.ig-tile .ig-overlay {
  position: absolute; inset: 0;
  background: rgba(14,17,22,0.6);
  display: grid;
  place-items: center;
  opacity: 0;
  transition: opacity 0.3s ease;
  color: var(--white);
  font-size: 13px;
  letter-spacing: 0.08em;
}
.ig-tile:hover .ig-overlay { opacity: 1; }
.ig-tile .meta-bar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 12px 16px;
  display: flex; justify-content: space-between;
  font-size: 11px;
  color: rgba(255,255,255,0.85);
  font-family: var(--sans);
  letter-spacing: 0.04em;
  background: linear-gradient(transparent, rgba(0,0,0,0.4));
}

/* Bible Intro page */
.intro-page { padding: var(--s5) 0 var(--s7); }
.intro-hero {
  padding: var(--s6) 0 var(--s5);
  border-bottom: 1px solid var(--line);
  margin-bottom: var(--s6);
  text-align: center;
}
.intro-hero h1 { font-family: var(--serif-display); font-weight: 400; font-size: clamp(48px, 6vw, 88px); line-height: 1.05; letter-spacing: -0.02em; }
.intro-hero h1 em { color: var(--accent); font-style: italic; }
.intro-hero p { max-width: 580px; margin: 24px auto 0; font-family: var(--serif); font-style: italic; font-size: 19px; color: var(--ink-mute); line-height: 1.55; }
.intro-tab-bar {
  display: flex;
  gap: 32px;
  justify-content: center;
  margin-bottom: var(--s5);
  border-bottom: 1px solid var(--line);
}
.intro-tab {
  padding: 16px 4px;
  font-family: var(--serif);
  font-size: 22px;
  color: var(--ink-mute);
  cursor: pointer;
  position: relative;
  transition: color 0.2s;
}
.intro-tab:hover { color: var(--ink); }
.intro-tab.active { color: var(--ink); }
.intro-tab.active::after {
  content: ""; position: absolute;
  left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent);
}
.intro-tab .count {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
  margin-left: 8px;
  vertical-align: middle;
}
.book-section { margin-bottom: var(--s6); }
.intro-section { margin-bottom: var(--s6); }

/* Series */
.series-promo { padding: var(--s7) 0; border-top: 1px solid var(--line); }
.series-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
  margin-top: var(--s5);
}
.series-card {
  background: var(--white);
  border: 1px solid var(--line);
  padding: 32px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  cursor: pointer;
  transition: border-color 0.2s, transform 0.2s;
  text-decoration: none;
  color: var(--ink);
  position: relative;
  overflow: hidden;
}
.series-card:hover { border-color: var(--accent); }
.series-card .series-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 4px 10px;
  align-self: flex-start;
  border-radius: 999px;
}
.series-card .series-badge.ongoing { background: var(--accent-soft); color: var(--accent); }
.series-card .series-badge.completed { background: var(--paper-2); color: var(--ink-mute); }
.series-card .series-badge .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: currentColor;
}
.series-card .series-badge.ongoing .dot { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.series-card h3 {
  font-family: var(--serif-display);
  font-size: 36px;
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 1.05;
}
.series-card h3 em { color: var(--accent); font-style: italic; }
.series-card .tagline {
  font-family: var(--serif);
  font-style: italic;
  font-size: 17px;
  color: var(--ink-mute);
  line-height: 1.5;
}
.series-card .meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: auto;
  padding-top: 20px;

}
.series-card .meta .arrow { font-size: 18px; color: var(--accent); }
.series-card .progress {
  height: 2px;
  background: var(--line);

  margin-top: 12px;
}
.series-card .progress-fill {

}

/* Series Page */
.series-page-hero { padding: var(--s6) 0 var(--s5); border-bottom: 1px solid var(--line); margin-bottom: var(--s6); text-align: center; }
.series-page-hero h1 { font-family: var(--serif-display); font-weight: 400; font-size: clamp(48px, 6vw, 88px); line-height: 1.05; letter-spacing: -0.02em; }
.series-page-hero h1 em { color: var(--accent); font-style: italic; }
.series-page-hero p { max-width: 580px; margin: 24px auto 0; font-family: var(--serif); font-style: italic; font-size: 19px; color: var(--ink-mute); line-height: 1.55; }
.series-detail-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px;
}
.series-detail {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 40px;
  padding: 32px;
  background: var(--white);
  border: 1px solid var(--line);

}
.series-detail .visual {

  background: var(--paper-2);
  position: relative;
  overflow: hidden;
}
.series-detail .body h2 {
  font-family: var(--serif-display);
  font-size: 44px;
  font-weight: 400;
  letter-spacing: -0.01em;
  margin-bottom: 12px;
}
.series-detail .body h2 em { color: var(--accent); font-style: italic; }
.series-detail .body .tagline {
  font-family: var(--serif);
  font-style: italic;
  font-size: 20px;
  color: var(--ink-mute);
  margin-bottom: 20px;
  line-height: 1.5;
}
.series-detail .body p {
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.7;
  color: var(--ink-soft);
  margin-bottom: 24px;
}
.series-detail .stats {
  display: flex;
  gap: 32px;
  margin-bottom: 24px;
  padding: 16px 0;
  border-top: 1px solid var(--line-soft);
  border-bottom: 1px solid var(--line-soft);
}
.series-detail .stats .stat .num {
  font-family: var(--serif-display);
  font-style: italic;
  font-size: 36px;
  color: var(--accent);
  line-height: 1;
}
.series-detail .stats .stat .lbl {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--ink-mute);
  text-transform: uppercase;
  margin-top: 6px;
}

/* Psalms weekly progress block on Intro page */
.psalms-progress {
  background: linear-gradient(135deg, var(--accent-soft) 0%, var(--paper-2) 100%);
  padding: 32px;
  margin: var(--s5) 0;
  border-left: 3px solid var(--accent);
}
.psalms-progress .head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 16px;
}
.psalms-progress h3 {
  font-family: var(--serif-display);
  font-size: 28px;
  font-style: italic;
  font-weight: 400;
}
.psalms-progress .progress-num {
  font-family: var(--serif-display);
  font-style: italic;
  font-size: 28px;
  color: var(--accent);
}
.psalms-progress .progress-num .total { color: var(--ink-faint); font-size: 18px; }
.psalms-progress .bar {
  height: 4px;
  background: var(--white);
  border-radius: 2px;
  overflow: hidden;
  margin: 12px 0 16px;
}
.psalms-progress .bar-fill { height: 100%; background: var(--accent); }
.psalms-progress p { font-family: var(--serif); color: var(--ink-soft); line-height: 1.6; }

@media (max-width: 980px) {
  .series-grid { grid-template-columns: 1fr; }
  .series-detail { grid-template-columns: 1fr; padding: 24px; }
  .series-detail .visual { aspect-ratio: 16/9; }
}

/* Bible Intro promo on home */
.intro-promo { background: var(--paper-2); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.intro-promo-inner {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--s6);
  align-items: center;
}
.intro-promo-text h2 em { color: var(--accent); font-style: italic; }
.intro-promo-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
}
.intro-promo-card {
  background: var(--white);
  padding: 28px 24px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  cursor: pointer;
  transition: background 0.2s ease;
  min-height: 130px;
  justify-content: space-between;
}
.intro-promo-card:hover { background: var(--accent-soft); }
.intro-promo-num {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--accent);
  text-transform: uppercase;
}
.intro-promo-name {
  font-size: 26px;
  font-weight: 400;
  color: var(--ink);
  letter-spacing: -0.01em;
  line-height: 1.1;
}
.intro-promo-en {
  font-family: var(--sans);
  font-size: 12px;
  color: var(--ink-mute);
  font-style: italic;
}
@media (max-width: 980px) {
  .intro-promo-inner { grid-template-columns: 1fr; }
}.book-section h3 {
  font-family: var(--serif-display);
  font-size: 28px;
  font-style: italic;
  font-weight: 400;
  color: var(--accent);
  margin-bottom: 8px;
}
.book-section .section-sub {
  font-size: 13px;
  color: var(--ink-mute);
  letter-spacing: 0.04em;
  margin-bottom: var(--s3);
  padding-bottom: var(--s3);
  border-bottom: 1px solid var(--line-soft);
}
.book-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
}
.book-card {
  background: var(--white);
  padding: 18px 20px;
  cursor: pointer;
  transition: background 0.2s ease;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-height: 92px;
}
.book-card:hover { background: var(--paper-2); }
.book-card.published { background: var(--paper-2); }
.book-card.published:hover { background: var(--accent-soft); }
.book-card .book-num {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
  text-transform: uppercase;
}
.book-card .book-name {
  font-family: var(--serif);
  font-size: 19px;
  color: var(--ink);
  letter-spacing: -0.005em;
  line-height: 1.2;
}
.book-card .book-en {
  font-family: var(--sans);
  font-size: 11px;
  color: var(--ink-mute);
  font-style: italic;
}
.book-card.published .book-name::after {
  content: "•";
  color: var(--accent);
  margin-left: 6px;
}
.book-card .book-status {
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  margin-top: auto;
}
.book-card:not(.published) .book-status { color: var(--ink-faint); }
@media (max-width: 980px) {
  .ig-grid { grid-template-columns: repeat(2, 1fr); }
  .book-grid { grid-template-columns: repeat(2, 1fr); }
  .intro-tab-bar { gap: 16px; flex-wrap: wrap; }
}

/* Testimony block */
.testimony-section {
  background: var(--paper-2);
  padding: var(--s7) 0;
}
.testimony-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--s5);
  margin-top: var(--s5);
}
.testimony-card blockquote {
  font-family: var(--serif);
  font-size: 22px;
  line-height: 1.45;
  color: var(--ink);
  font-weight: 400;
  margin-bottom: var(--s3);
}
.testimony-card blockquote::before {
  content: "「";
  font-family: var(--serif);
  color: var(--accent-2);
}
.testimony-card blockquote::after {
  content: "」";
  font-family: var(--serif);
  color: var(--accent-2);
}
.testimony-card.en blockquote::before { content: "\201C"; }
.testimony-card.en blockquote::after { content: "\201D"; }
.testimony-card .who {
  font-size: 13px;
  color: var(--ink-mute);
  display: flex;
  align-items: center;
  gap: 12px;
}
.testimony-card .who .avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--accent-soft);
  display: grid;
  place-items: center;
  font-family: var(--serif);
  color: var(--accent);
  font-size: 16px;
}

/* Newsletter */
.newsletter {
  padding: var(--s7) 0;
  text-align: center;
  border-top: 1px solid var(--line);
}
.newsletter-form {
  margin-top: var(--s5);
  display: flex;
  gap: 12px;
  justify-content: center;
  max-width: 480px;
  margin-left: auto;
  margin-right: auto;
}
.newsletter-form input {
  flex: 1;
  padding: 14px 20px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--white);
  font-size: 14px;
  font-family: var(--sans);
  color: var(--ink);
}
.newsletter-form input:focus {
  outline: none;
  border-color: var(--ink);
}
.newsletter-thanks {
  margin-top: var(--s4);
  font-size: 22px;
  font-style: italic;
  color: var(--accent);
}

/* ===== TODAY (Daily Devotion) ===== */
.today-page {
  padding-top: var(--s5);
  padding-bottom: var(--s7);
}
.today-hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 70vh;
  border: 1px solid var(--line);
  background: var(--white);
}
.today-hero .image-side .photo { height: 100%; aspect-ratio: auto; }
.today-hero .text-side {
  padding: var(--s6) var(--s5);
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.today-date {
  display: flex;
  align-items: baseline;
  gap: var(--s3);
  margin-bottom: var(--s4);
}
.today-date .day {
  font-family: var(--serif-display);
  font-size: 64px;
  font-style: italic;
  color: var(--accent);
  line-height: 1;
}
.today-date .month-year { color: var(--ink-mute); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }

.today-verse-ref {
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: var(--s3);
}
.today-verse {
  font-family: var(--serif);
  font-size: clamp(28px, 2.6vw, 38px);
  line-height: 1.35;
  color: var(--ink);
  letter-spacing: -0.005em;
  margin-bottom: var(--s4);
}
.today-verse .verse-num {
  font-family: var(--serif);
  font-size: 0.55em;
  vertical-align: super;
  color: var(--accent-2);
  margin-right: 4px;
}
.today-actions {
  display: flex;
  gap: 12px;
  margin-top: var(--s4);
}
.today-action-btn {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  color: var(--ink-soft);
  transition: all 0.2s ease;
}
.today-action-btn:hover { border-color: var(--ink); background: var(--ink); color: var(--paper); }

.today-reflection {
  margin-top: var(--s7);
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: var(--s5);
}
.today-reflection .label {
  font-family: var(--serif-display);
  font-size: 28px;
  font-style: italic;
  color: var(--accent);
}
.today-reflection .text {
  font-family: var(--serif);
  font-size: 22px;
  line-height: 1.7;
  color: var(--ink-soft);
  max-width: 720px;
}
.today-reflection .text p + p { margin-top: 1em; }

.today-prompts {
  margin-top: var(--s6);
  padding: var(--s5);
  background: var(--paper-2);
  border-radius: var(--radius);
}
.today-prompts h3 { font-family: var(--serif); font-size: 22px; font-weight: 400; margin-bottom: var(--s3); }
.today-prompts ol { padding-left: 0; list-style: none; counter-reset: pr; }
.today-prompts li {
  counter-increment: pr;
  position: relative;
  padding-left: 56px;
  font-family: var(--serif);
  font-size: 19px;
  line-height: 1.55;
  color: var(--ink-soft);
  padding-bottom: var(--s2);
}
.today-prompts li::before {
  content: counter(pr, decimal-leading-zero);
  position: absolute;
  left: 0;
  top: 4px;
  font-family: var(--serif-display);
  font-size: 14px;
  font-style: italic;
  color: var(--accent-2);
  letter-spacing: 0.05em;
}

.today-week-strip {
  margin-top: var(--s6);
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
}
.today-week-strip .day-cell {
  background: var(--white);
  padding: 18px 16px;
  text-align: center;
  cursor: pointer;
  transition: background 0.2s ease;
}
.today-week-strip .day-cell:hover { background: var(--paper-2); }
.today-week-strip .day-cell.today { background: var(--ink); color: var(--paper); }
.today-week-strip .day-cell .num { font-family: var(--serif); font-size: 22px; }
.today-week-strip .day-cell .name { font-size: 11px; letter-spacing: 0.08em; color: var(--ink-mute); margin-top: 4px; text-transform: uppercase; }
.today-week-strip .day-cell.today .name { color: var(--paper); opacity: 0.6; }

/* ===== READ (Bible) ===== */
.read-page { padding: var(--s5) 0 var(--s7); }
.read-layout {
  display: grid;
  grid-template-columns: 240px 1fr 280px;
  gap: var(--s5);
  align-items: start;
}
.read-sidebar {
  position: sticky;
  top: 88px;
  border-right: 1px solid var(--line);
  padding-right: var(--s3);
}
.read-sidebar h4 {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 12px;
  font-weight: 500;
}
.read-sidebar ul { list-style: none; margin-bottom: var(--s4); }
.read-sidebar li {
  padding: 6px 0;
  font-family: var(--serif);
  font-size: 17px;
  color: var(--ink-soft);
  cursor: pointer;
  transition: color 0.2s;
}
.read-sidebar li:hover { color: var(--ink); }
.read-sidebar li.active { color: var(--accent); font-style: italic; }

.read-search {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  font-size: 13px;
  font-family: var(--sans);
  margin-bottom: var(--s3);
  background: var(--white);
}
.read-search:focus { outline: none; border-color: var(--ink); }

.read-content {
  max-width: 660px;
  margin: 0 auto;
}
.read-chapter-head {
  border-bottom: 1px solid var(--line);
  padding-bottom: var(--s3);

}
.read-chapter-head h1 {

}
.read-chapter-head h1 em { font-style: italic; color: var(--accent); margin-left: 12px; }
.read-chapter-head .version { font-size: 11px; letter-spacing: 0.18em; color: var(--ink-mute); text-transform: uppercase; }

.read-verse {
  font-family: var(--serif);
  font-size: 20px;
  line-height: 1.85;

}
.read-verse .vnum {
  position: absolute;
  left: 0;

}

}

.read-aside {

}
.read-aside h4 {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 12px;
  font-weight: 500;
}
.read-aside-card {
  padding: var(--s3) 0;
  border-bottom: 1px solid var(--line-soft);
}
.read-aside-card:last-child { border-bottom: 0; }
.read-aside-card .ref { font-size: 11px; letter-spacing: 0.08em; color: var(--accent); text-transform: uppercase; margin-bottom: 4px; }
.read-aside-card p { font-family: var(--serif); font-size: 15px; line-height: 1.5; color: var(--ink-soft); }

.chapter-nav {
  display: flex;
  justify-content: space-between;
  margin-top: var(--s5);
  padding-top: var(--s4);
  border-top: 1px solid var(--line);
}
.chapter-nav a {
  font-family: var(--serif);
  font-size: 17px;
  font-style: italic;
  color: var(--ink-mute);
  display: flex;
  align-items: center;
  gap: 8px;
}
.chapter-nav a:hover { color: var(--accent); }

/* ===== LIBRARY ===== */
.library-page { padding: var(--s5) 0 var(--s7); }
.library-hero {
  padding: var(--s6) 0 var(--s5);
  border-bottom: 1px solid var(--line);
  margin-bottom: var(--s6);
}
.library-hero h1 { font-family: var(--serif-display); font-size: clamp(48px, 6vw, 88px); font-weight: 400; line-height: 1.02; letter-spacing: -0.02em; }
.library-hero h1 em { color: var(--accent); font-style: italic; }
.library-hero p { max-width: 540px; margin-top: var(--s3); font-size: 17px; color: var(--ink-mute); line-height: 1.6; }

.library-filters {
  display: flex;
  gap: 8px;
  margin-bottom: var(--s5);
  flex-wrap: wrap;
}
.library-filter {

}

/* ===== ARTICLE PAGE ===== */
.article-page { padding-bottom: var(--s7); }
.article-hero {
  padding: var(--s6) 0 var(--s5);
  text-align: center;
  max-width: 760px;
  margin: 0 auto;
}
.article-hero .crumb {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: var(--s3);
}
.article-hero h1 {
  font-family: var(--serif-display);
  font-weight: 400;
  font-size: clamp(40px, 5vw, 64px);
  line-height: 1.1;
  letter-spacing: -0.015em;
}
.article-hero .deck {
  margin-top: var(--s3);
  font-family: var(--serif);
  font-style: italic;
  font-size: 22px;
  color: var(--ink-mute);

}
.article-hero .meta {
  margin-top: var(--s4);

  gap: 20px;
  justify-content: center;
  font-size: 13px;
  color: var(--ink-mute);
  letter-spacing: 0.04em;
}

.article-body {
  max-width: 660px;
  margin: 0 auto;
  font-family: var(--serif);
  font-size: 19px;
  line-height: 1.75;
  color: var(--ink);
}

  font-size: 24px;

  color: var(--ink-soft);
  font-style: italic;
}
.article-body .pull {
  font-family: var(--serif-display);
  font-size: 32px;
  line-height: 1.3;
  color: var(--accent);
  font-style: italic;
  text-align: center;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: var(--s4) 0;
  margin: var(--s5) 0;

}
.article-body h2 {
  font-family: var(--serif);
  font-size: 28px;
  font-weight: 500;
  margin-top: 1.6em;
  margin-bottom: 0.6em;
  color: var(--ink);
}
.article-body blockquote {
  border-left: 2px solid var(--accent-2);
  padding-left: var(--s3);
  margin: var(--s4) 0;
  font-style: italic;
  color: var(--ink-soft);
}

.article-feature-image { margin: var(--s5) 0; max-width: 880px; margin-left: auto; margin-right: auto; }

/* ===== ABOUT ===== */
.about-hero {
  padding: var(--s7) 0 var(--s6);
  text-align: center;
  max-width: 800px;
  margin: 0 auto;
}
.about-hero h1 {
  font-family: var(--serif-display);

const { useState: us, useEffect: ue } = React;

function parseHash() {
  const h = window.location.hash || "#/";
  const m = h.replace(/^#\//, "").split("/");
  return { route: m[0] || "home", param: m[1] || null };
}

function App() {
  const [lang, setLang] = us(() => localStorage.getItem("daoinsight.lang") || "zh");
  const [{ route, param }, setLoc] = us(parseHash());

  ue(() => {
    const onHash = () => {
      setLoc(parseHash());
      window.scrollTo({ top: 0, behavior: "instant" });
    };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  ue(() => {
    localStorage.setItem("daoinsight.lang", lang);
    document.documentElement.lang = lang === "en" ? "en" : "zh-Hant";
  }, [lang]);

  const navigate = (r, p) => {
    window.location.hash = "#/" + r + (p ? "/" + p : "");
  };

  let page;
  switch (route) {
    case "today":   page = <TodayPage lang={lang} navigate={navigate} />; break;
    case "read":    page = <ReadPage lang={lang} navigate={navigate} />; break;
    case "library": page = <LibraryPage lang={lang} navigate={navigate} />; break;
    case "series":  page = <SeriesPage lang={lang} navigate={navigate} />; break;
    case "article": page = <ArticlePage lang={lang} navigate={navigate} articleId={param} />; break;
    case "intro":   page = <IntroPage lang={lang} navigate={navigate} />; break;
    case "about":   page = <AboutPage lang={lang} navigate={navigate} />; break;
    case "home":
    default:        page = <HomePage lang={lang} navigate={navigate} />; break;
  }

  // Map article→library for active nav state
  const navRoute = route === "article" ? "library" : route;

  return (
    <div className={lang === "en" ? "lang-en" : "lang-zh"}>
      <Nav route={navRoute} lang={lang} setLang={setLang} navigate={navigate} />
      <main key={route + (param || "")}>{page}</main>
      <Footer lang={lang} navigate={navigate} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
