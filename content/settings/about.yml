bio_zh: |-
  Pastor Gary 是一位在學術與靈修之間寫字的牧者。

  他相信，聖經不是要被「讀完」的書，而是要慢慢進入、反覆停留的家。在這裡寫字，是為了讓更多人——不分宗派、不分年齡、不論信仰深淺——都能在生活的縫隙中，重新與神相遇。
bio_en: |-
  Pastor Gary writes at the meeting place of scholarship and devotion.

  He believes scripture is not a book to be finished, but a home to slowly enter and stay within. He writes here so that more people—across denominations, ages, and degrees of faith—might meet God again in the cracks of daily life.
