hero_eyebrow_zh: 日日靈光 · 慢讀聖經
hero_eyebrow_en: Daily light · Slow scripture
hero_title_zh: |-
  在忙碌的
  *生活之間*，
  遇見神。
hero_title_en: |-
  Meeting God
  *between*
  busy days.
hero_sub_zh: daoinsight 是一個為現代人預備的慢讀空間。每天一段經文、一段默想，讓信仰在你的城市生活裡，悄悄重新發芽。
hero_sub_en: daoinsight is a quiet reading space for the modern soul. One verse, one reflection each day — letting faith take root again in your city life.
